app-id: io.github.jhaygood86.mauborgne
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: io.github.jhaygood86.mauborgne
finish-args:
  - '--device=dri'
  - '--share=ipc'
  - '--share=network'
  - '--socket=fallback-x11'
  - '--socket=wayland'
  - '--talk-name=org.freedesktop.secrets'
  
cleanup:
- '/include'
- '/lib/pkgconfig'
- '/share/vala'
- '*.a'
- '*.la'
  
modules:
  - name: libcotp
    buildsystem: cmake
    sources:
    - type: git
      url: https://github.com/paolostivanin/libcotp.git
      tag: v4.2.2

  - name: libportal
    buildsystem: meson
    config-opts:
      - -Dbackend-gtk4=enabled
      - -Ddocs=false
    sources:
    - type: git
      url: https://github.com/flatpak/libportal.git
      tag: '0.11.0'

  - name: fontawesome
    buildsystem: simple
    build-commands:
      - cd svgs/brands/; for filename in *; do install -D ${filename} /app/share/icons/hicolor/scalable/apps/${filename%.svg}-symbolic.svg; done
    sources:
    - type: git
      url: https://github.com/FortAwesome/Font-Awesome.git
      tag: 7.3.1

  - name: mauborgne
    buildsystem: meson
    build-options:
      # the OPAQUE client (subprojects/opaque-bridge) is Rust; cargo-sources.json vendors its crates
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/mauborgne/cargo
    sources:
    - type: dir
      path: .
    - subprojects/opaque-bridge/cargo-sources.json
